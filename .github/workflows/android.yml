name: Android debug APK

# Builds the app and attaches an installable debug APK to the run.
# Add your Google Maps key as a repository secret named MAPS_API_KEY
# (Settings > Secrets and variables > Actions). Without it the app still builds
# and uses its built-in offline map.
on:
  workflow_dispatch:
  push:
    branches: [ccr-4c516141-nuieuw]
    paths: ['app/**', 'core/**', 'gradle/**', '*.kts', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the Android SDK; just accept licences and make sure API 35 is there.
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Core safety tests
        run: chmod +x gradlew && ./gradlew -Parmor.coreOnly=true :core:test --no-daemon
      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Check the APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          ls -l "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|^sdkVersion|^targetSdkVersion|^native-code|^application-label:|uses-permission: name='android.permission.(CALL_PHONE|SEND_SMS|RECEIVE_BOOT_COMPLETED)'"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: armor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
