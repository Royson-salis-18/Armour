name: Android debug APK

# Builds the app and attaches an installable debug APK to the run.
# Add your Google Maps key as a repository secret named MAPS_API_KEY
# (Settings > Secrets and variables > Actions). Without it the app still builds
# and uses its built-in offline map.
on:
  workflow_dispatch:
  push:
    branches: [ccr-4c516141-nuieuw]
    paths: ['app/**', 'core/**', 'gradle/**', '*.kts', '.github/workflows/android.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Core safety tests
        run: chmod +x gradlew && ./gradlew -Parmor.coreOnly=true :core:test --no-daemon
      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: armor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
