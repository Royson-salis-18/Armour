name: UI tour on an emulator

# Installs the debug APK on an Android emulator, rides through the main screens with a simulated GPS
# (scripts/ui-tour.sh), prints tile and crash logs, and pushes the screenshots to the ci-screens branch.
on:
  workflow_dispatch:
  push:
    branches: [ccr-4c516141-nuieuw]
    paths: ['app/**', 'core/**', 'scripts/ui-tour.sh', '.github/workflows/ui-tour.yml']

permissions:
  contents: write

jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ride on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/ui-tour.sh
      - name: Push screenshots to ci-screens
        if: always()
        run: |
          [ -d screens ] || exit 0
          cp -r screens /tmp/screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-screens
          git rm -rfq --cached .
          git clean -fdxq -e screens
          rm -rf screens && cp -r /tmp/screens screens
          git add screens
          git commit -qm "UI tour screenshots for ${GITHUB_SHA::7}"
          git push -f origin HEAD:ci-screens
