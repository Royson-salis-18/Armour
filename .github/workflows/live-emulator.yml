name: Live emulator

# Starts the app on an Android emulator and opens a short-lived public web remote (scripts/live) so the app can be
# watched and used from any browser, with no install. The link (with a random secret) is written to the ci-live branch.
# Start it from the Actions tab (Run workflow) and pick how many minutes it should stay up.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to keep it running (minutes, 5 to 120)'
        default: '40'

permissions:
  contents: write

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator and web remote
        uses: reactivecircus/android-emulator-runner@v2
        env:
          LIVE_MINUTES: ${{ inputs.minutes || '40' }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/live/run.sh
