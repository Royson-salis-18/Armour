name: Demo video

# Records a narrated walkthrough of the app on an Android emulator (scripts/demo): voiceover per scene, a screen
# recording per scene timed to it, joined into ARMOR-demo.mp4 with subtitles, saved on the ci-video branch.
on:
  workflow_dispatch:
  push:
    branches: [ccr-4c516141-nuieuw]
    paths: ['scripts/demo/**', '.github/workflows/demo-video.yml']

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Voiceover
        run: |
          sudo apt-get install -y -qq ffmpeg espeak-ng > /dev/null
          pip install -q edge-tts
          python3 scripts/demo/narrate.py narration
          cat narration/durations.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/demo/record.sh
      - name: Edit the video
        if: always()
        run: python3 scripts/demo/make_video.py video narration ARMOR-demo.mp4
      - name: Save to the ci-video branch
        if: always()
        run: |
          mkdir -p /tmp/out/debug && cp ARMOR-demo.mp4 /tmp/out/ 2>/dev/null || true
          cp video/debug/*.png /tmp/out/debug/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-video
          git rm -rfq --cached .
          git clean -fdxq
          cp -r /tmp/out/* .
          git add -A .
          git commit -qm "Demo video for ${GITHUB_SHA::7}"
          git push -f origin HEAD:ci-video
